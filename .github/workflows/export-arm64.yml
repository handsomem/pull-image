name: Export ECK 2.2.0 arm64

on: workflow_dispatch

jobs:
  export:
    runs-on: ubuntu-24.04-arm  # 原生 arm64 环境
    
    steps:
      - name: Pull image
        run: |
          docker pull docker.elastic.co/eck/eck-operator:2.2.0
          
      - name: Save and compress
        run: |
          docker save docker.elastic.co/eck/eck-operator:2.2.0 | gzip > eck-operator-2.2.0-arm64.tar.gz
          ls -lh eck-operator-2.2.0-arm64.tar.gz
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eck-operator-2.2.0-arm64
          path: eck-operator-2.2.0-arm64.tar.gz
          retention-days: 5
